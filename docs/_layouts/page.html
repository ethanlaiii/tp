---
layout: default
---
<div class="page-with-toc">
  <article class="post">

    <header class="post-header">
      <h1 class="post-title">{{ page.title | escape }}</h1>
    </header>

    <div class="post-content">
      {{ content }}
    </div>

  </article>

  <nav class="toc-sidebar" aria-label="On this page" hidden></nav>
</div>

<script src="{{ "/assets/js/toc-sidebar.js" | relative_url }}"></script>
